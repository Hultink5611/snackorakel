<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Het Snackorakel — Snackbar Karst</title>
<meta name="theme-color" content="#D62828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snackorakel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Bree+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --rood:#D62828; --rood-diep:#9D1C1C; --geel:#FCBF49; --geel-warm:#F77F00;
    --creme:#FFF4E0; --bruin:#2E1A10; --wit:#FFFDF7; --groen:#3B8C4E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif; color:var(--bruin);
    background:var(--rood);
    background-image:radial-gradient(var(--rood-diep) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    min-height:100vh; padding:24px 16px 48px; display:flex; justify-content:center;
  }
  .frame{width:100%; max-width:440px}

  .sign{
    background:var(--bruin); border:6px solid var(--geel); border-radius:14px;
    padding:18px 20px 22px; text-align:center; position:relative;
    box-shadow:0 8px 0 rgba(0,0,0,.25);
  }
  .sign .friet{font-size:34px; line-height:1}
  .sign h1{
    font-family:'Anton',sans-serif; color:var(--geel); font-size:46px;
    letter-spacing:1px; text-transform:uppercase; line-height:.92; margin:4px 0 2px;
    text-shadow:3px 3px 0 var(--rood);
  }
  .sign .sub{color:var(--creme); font-family:'Bree Serif',serif; font-size:14px; letter-spacing:2px; text-transform:uppercase}
  .bulbs{position:absolute; top:-4px; left:0; right:0; display:flex; justify-content:space-around; padding:0 14px}
  .bulb{width:9px; height:9px; border-radius:50%; background:var(--geel); margin-top:-4px; box-shadow:0 0 6px var(--geel); animation:flick 1.2s infinite}
  .bulb:nth-child(odd){animation-delay:.6s}
  @keyframes flick{0%,100%{opacity:1}50%{opacity:.35}}
  .mute{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; border:2px solid var(--geel);
    background:rgba(0,0,0,.25); color:var(--geel); font-size:16px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center}

  .install-btn{display:none; width:100%; margin-top:12px; font-family:'Anton',sans-serif; text-transform:uppercase;
    letter-spacing:.5px; font-size:16px; cursor:pointer; color:var(--bruin); background:var(--geel);
    border:4px solid var(--geel-warm); border-radius:12px; padding:12px; box-shadow:0 4px 0 var(--geel-warm); transition:transform .06s}
  .install-btn.show{display:block; animation:pulseIn .4s ease-out}
  .install-btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--geel-warm)}
  @keyframes pulseIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modes{display:flex; gap:10px; margin:18px 0 14px}
  .mode{
    flex:1; cursor:pointer; border:4px solid var(--bruin); border-radius:12px;
    background:var(--creme); padding:12px 8px; text-align:center; transition:transform .08s;
    box-shadow:0 4px 0 var(--bruin);
  }
  .mode:active{transform:translateY(2px); box-shadow:0 2px 0 var(--bruin)}
  .mode .emoji{font-size:26px}
  .mode .nm{font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px; letter-spacing:.5px; margin-top:2px}
  .mode .ds{font-size:11px; color:#7a5c45; font-weight:600}
  .mode.on{background:var(--geel); border-color:var(--geel-warm); box-shadow:0 4px 0 var(--geel-warm)}

  .panel{background:var(--creme); border:4px solid var(--bruin); border-radius:14px; padding:16px; box-shadow:0 6px 0 rgba(0,0,0,.25)}
  .row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:2px dashed #d9c3a3}
  .row.last{border-bottom:none}
  .row .lbl{font-family:'Anton',sans-serif; text-transform:uppercase; font-size:17px; letter-spacing:.5px}
  .seg{display:flex; gap:6px}
  .seg button{
    font-family:'Anton',sans-serif; font-size:14px; min-width:38px; height:38px; padding:0 10px; cursor:pointer;
    border:3px solid var(--bruin); border-radius:9px; background:var(--wit); color:var(--bruin); text-transform:uppercase;
  }
  .seg button.on{background:var(--rood); color:var(--wit); border-color:var(--rood-diep)}
  .toggle{width:62px; height:34px; border-radius:20px; border:3px solid var(--bruin); background:var(--wit); position:relative; cursor:pointer; flex:none}
  .toggle .knob{position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--bruin); transition:left .12s}
  .toggle.on{background:var(--groen); border-color:#2c6b3b}
  .toggle.on .knob{left:32px; background:var(--wit)}
  .subrow{display:none; padding:4px 0 12px; border-bottom:2px dashed #d9c3a3}
  .subrow.show{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px}
  .subrow .sl{font-size:12px; font-weight:800; color:#8a7560; text-transform:uppercase; letter-spacing:.5px}
  .budgetctl{display:flex; align-items:center; gap:12px}
  #rng-budget{width:130px; accent-color:var(--rood); cursor:pointer; height:6px}
  .budgetnum{display:flex; align-items:center; gap:3px; font-family:'Anton',sans-serif; font-size:18px; color:var(--bruin)}
  .budgetnum input{width:48px; font-family:'Anton',sans-serif; font-size:18px; color:var(--bruin); background:var(--wit);
    border:3px solid var(--bruin); border-radius:8px; text-align:center; padding:3px 0; -moz-appearance:textfield}
  .budgetnum input:focus{outline:none; border-color:var(--rood)}
  .budgetwarn{display:none; margin-top:10px; padding:8px 10px; font-size:12px; font-weight:800; line-height:1.35;
    color:var(--rood-diep); background:#ffe3da; border:2px solid var(--rood); border-radius:9px; text-align:center}
  .budgetwarn.show{display:block}
  .budgetnum input::-webkit-outer-spin-button,.budgetnum input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}

  .bigwrap{position:relative; margin:22px 0 6px; text-align:center}
  .star{position:absolute; inset:-10px 0; display:flex; align-items:center; justify-content:center; pointer-events:none}
  .star svg{width:100%; height:130px}
  .big{
    position:relative; font-family:'Anton',sans-serif; text-transform:uppercase;
    font-size:40px; letter-spacing:2px; color:var(--wit); cursor:pointer;
    background:var(--rood); border:5px solid var(--wit); border-radius:16px;
    padding:18px 30px; width:100%;
    box-shadow:0 7px 0 var(--rood-diep), 0 7px 0 6px rgba(0,0,0,.2);
    text-shadow:2px 2px 0 var(--rood-diep); transition:transform .06s;
  }
  .big:active{transform:translateY(5px); box-shadow:0 2px 0 var(--rood-diep)}
  .big:disabled{filter:grayscale(.4) brightness(.9); cursor:default}

  /* ---------- Slot machine ---------- */
  .slot{display:none; gap:8px; justify-content:center; align-items:flex-start; flex-wrap:wrap; margin-top:20px;
    background:var(--bruin); border:5px solid var(--geel); border-radius:16px; padding:16px 12px;
    box-shadow:0 6px 0 rgba(0,0,0,.3), inset 0 0 0 3px var(--rood-diep)}
  .slot.show{display:flex}
  .reel{width:72px; display:flex; flex-direction:column; align-items:center}
  .window{
    width:72px; height:72px; overflow:hidden; border-radius:10px; background:var(--wit);
    border:3px solid var(--rood-diep); position:relative;
    box-shadow:inset 0 8px 10px -6px rgba(0,0,0,.5), inset 0 -8px 10px -6px rgba(0,0,0,.5);
  }
  .window::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.18), transparent 30%, transparent 70%, rgba(0,0,0,.18))}
  .strip{display:flex; flex-direction:column; will-change:transform}
  .tile{height:72px; display:flex; align-items:center; justify-content:center; font-size:40px; flex:none}
  .reel.locked .window{border-color:var(--geel-warm); box-shadow:0 0 0 3px var(--geel), inset 0 0 12px rgba(247,127,0,.4)}
  .reel.locked{animation:thunk .18s ease-out}
  @keyframes thunk{0%{transform:translateY(-5px)}60%{transform:translateY(3px)}100%{transform:translateY(0)}}
  .reel-label{margin-top:6px; font-size:9.5px; font-weight:800; color:var(--creme); text-transform:uppercase;
    text-align:center; line-height:1.15; min-height:24px; letter-spacing:.2px; opacity:0;
    width:100%; padding:0 1px; word-break:break-word; overflow-wrap:anywhere}
  .reel.locked .reel-label{opacity:1}

  .bon{background:var(--wit); margin-top:22px; padding:18px 20px 26px; position:relative; font-family:'Inter',sans-serif;
       clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),92% 100%,84% calc(100% - 9px),76% 100%,68% calc(100% - 9px),60% 100%,52% calc(100% - 9px),44% 100%,36% calc(100% - 9px),28% 100%,20% calc(100% - 9px),12% 100%,4% calc(100% - 9px),0 100%);
       box-shadow:0 6px 14px rgba(0,0,0,.35); display:none}
  .bon.show{display:block; animation:drop .8s cubic-bezier(.18,.7,.28,1); transform-origin:top center}
  @keyframes drop{
    0%{transform:translateY(-460px) rotate(-3deg); opacity:0}
    55%{opacity:1}
    65%{transform:translateY(14px) rotate(.6deg)}
    80%{transform:translateY(-7px) rotate(-.4deg)}
    92%{transform:translateY(3px) rotate(.15deg)}
    100%{transform:translateY(0) rotate(0)}
  }
  .bon h2{font-family:'Anton',sans-serif; text-align:center; text-transform:uppercase; font-size:20px; letter-spacing:1px}
  .bon .adr{text-align:center; font-size:11px; color:#8a7560; margin-bottom:10px; font-weight:600}
  .bon hr{border:none; border-top:2px dashed #cbb89c; margin:8px 0}
  .item{display:flex; justify-content:space-between; font-size:15px; padding:4px 0; font-variant-numeric:tabular-nums}
  .item .q{font-weight:800}
  .saus{font-size:12px; color:#8a7560; padding:0 0 2px 14px}
  .story{font-size:12.5px; color:#6b513c; font-style:italic; padding:10px 2px 2px; line-height:1.45}
  .tot{display:flex; justify-content:space-between; font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; margin-top:6px}
  .barcode{height:34px; margin-top:14px; background:repeating-linear-gradient(90deg,var(--bruin) 0 2px,transparent 2px 4px,var(--bruin) 4px 7px,transparent 7px 11px)}
  .actions{display:flex; gap:10px; margin-top:14px}
  .actions button{
    flex:1; font-family:'Anton',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.3px;
    cursor:pointer; border:3px solid var(--bruin); border-radius:10px; background:var(--creme); color:var(--bruin);
    padding:9px 6px; box-shadow:0 3px 0 var(--bruin); transition:transform .06s; line-height:1.1;
  }
  .actions + .actions{margin-top:10px}
  .actions button:active{transform:translateY(3px); box-shadow:0 0 0 var(--bruin)}
  .placeholder{margin-top:22px; text-align:center; color:var(--creme); font-family:'Bree Serif',serif; font-size:14px; opacity:.85}
  .tag{font-size:10px; background:var(--groen); color:#fff; padding:1px 6px; border-radius:6px; margin-left:6px; vertical-align:1px; font-weight:600}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--bruin); color:var(--creme);
    padding:10px 18px; border-radius:10px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="frame">

  <div class="sign">
    <div class="bulbs" id="bulbs"></div>
    <button class="mute" id="mute" onclick="toggleMute()" title="Geluid aan/uit">🔊</button>
    <div class="friet">🍟</div>
    <h1>Het<br>Snackorakel</h1>
    <div class="sub">Karst · Dedemsvaart</div>
  </div>

  <button class="install-btn" id="installBtn" onclick="doInstall()">📲 Installeer als app</button>

  <div class="modes">
    <div class="mode on" data-mode="wonder" onclick="setMode(this)">
      <div class="emoji">✨</div><div class="nm">Wonder</div><div class="ds">verrassend lekker</div>
    </div>
    <div class="mode" data-mode="gek" onclick="setMode(this)">
      <div class="emoji">🤪</div><div class="nm">Gek</div><div class="ds">totaal absurd</div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="lbl">Snacks</span>
      <div class="seg" id="seg-snacks">
        <button class="on" data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
      </div>
    </div>

    <div class="row">
      <span class="lbl">Vega snacks</span>
      <div class="seg" id="seg-vega">
        <button class="on" data-v="alles">Ja</button><button data-v="geen">Nee</button><button data-v="alleen">Alleen</button>
      </div>
    </div>

    <div class="row">
      <span class="lbl">Patat erbij</span>
      <div class="toggle" id="t-patat" onclick="togglePatat()"><div class="knob"></div></div>
    </div>
    <div class="subrow" id="sub-patat">
      <span class="sl">Grootte</span>
      <div class="seg" id="seg-patat">
        <button class="on" data-v="klein" data-p="2.35">Klein</button>
        <button data-v="groot" data-p="3.60">Groot</button>
      </div>
    </div>

    <div class="row">
      <span class="lbl">Milkshake</span>
      <div class="toggle on" id="t-shake" onclick="toggleShake()"><div class="knob"></div></div>
    </div>
    <div class="subrow show" id="sub-shake">
      <span class="sl">Grootte</span>
      <div class="seg" id="seg-shake">
        <button class="on" data-v="klein" data-p="3.00">Klein</button>
        <button data-v="medium" data-p="3.50">Medium</button>
        <button data-v="groot" data-p="4.00">Groot</button>
      </div>
    </div>

    <div class="row last">
      <span class="lbl">Budget</span>
      <div class="toggle" id="t-budget" onclick="toggleBudget()"><div class="knob"></div></div>
    </div>
    <div class="subrow" id="sub-budget" style="border-bottom:none">
      <span class="sl">Max</span>
      <div class="budgetctl">
        <input type="range" id="rng-budget" min="3" max="30" step="1" value="10" oninput="onSlider(this.value)">
        <div class="budgetnum"><span>€</span><input type="number" id="num-budget" min="1" max="99" step="1" value="10" inputmode="numeric" oninput="onNum(this.value)" onblur="fixNum()"></div>
      </div>
    </div>
    <div class="budgetwarn" id="budgetWarn"></div>
  </div>

  <div class="bigwrap">
    <div class="star"><svg viewBox="0 0 300 130"><polygon points="150,2 168,40 210,30 188,66 230,80 186,86 198,128 150,98 102,128 114,86 70,80 112,66 90,30 132,40" fill="#FCBF49"/></svg></div>
    <button class="big" id="btn-rammen" onclick="rammen()">RAMMEN!</button>
  </div>

  <div class="slot" id="slot"></div>

  <div class="placeholder" id="ph">↑ trek aan de hendel, laat het orakel draaien</div>

  <div class="bon" id="bon">
    <h2>Snackorakel</h2>
    <div class="adr">Snackbar Karst · Dedemsvaart</div>
    <hr>
    <div id="items"></div>
    <hr>
    <div class="tot"><span>Totaal</span><span id="totaal">€0,00</span></div>
    <div class="barcode"></div>
    <div class="actions">
      <button onclick="rammen()">Nog 'n keer</button>
    </div>
    <div class="actions">
      <button onclick="deelBon('vol')">📋 Kopieer bon</button>
      <button onclick="deelBon('tekst')">📝 Kopieer als tekst</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  /* ===========================================================================
     DATA — ECHTE Snackbar Karst (Dedemsvaart), bron: Jamezz QR-menu (juni 2026).
     Geen verzonnen producten. "Gek" combineert alleen ECHTE sauzen/smaken raar.
     =========================================================================== */

  const SNACKS=[
    {n:"Slaatje",p:2.00,vega:true},{n:"Vlampijp",p:2.25,vega:false},
    {n:"Vleeskroket",p:2.30,vega:false},{n:"Loempidel",p:2.40,vega:false},
    {n:"Frikandel",p:2.40,vega:false},{n:"Smulrol",p:2.50,vega:false},
    {n:"Krokidel",p:2.50,vega:false},{n:"Ham/kaas soufflé",p:2.50,vega:false},
    {n:"Kaaskroket",p:2.50,vega:false},{n:"Kalfskroket",p:2.50,vega:false},
    {n:"Satékroket",p:2.50,vega:false},{n:"Goulashkroket",p:2.50,vega:false},
    {n:"Kwekkeboom kroket",p:2.50,vega:false},{n:"Rauwkost",p:2.50,vega:true},
    {n:"Veg. kroket",p:2.50,vega:true},{n:"Groentekroket",p:2.50,vega:true},
    {n:"Vegetarische bami",p:2.50,vega:true},{n:"Vega frikandel",p:2.50,vega:true},
    {n:"Pikanto",p:2.60,vega:false},{n:"Bamischijf",p:2.60,vega:false},
    {n:"Kaassoufflé",p:2.60,vega:true},{n:"Nasischijf",p:2.60,vega:false},
    {n:"Kipcorn",p:2.60,vega:false},{n:"Frikandel curry & ui",p:2.60,vega:false},
    {n:"Shoarmarol",p:2.75,vega:false},{n:"Sitostick",p:2.75,vega:false},
    {n:"Boerenbrok",p:2.75,vega:false},{n:"Trio",p:2.75,vega:false},
    {n:"Hete donder",p:2.75,vega:false},{n:"Hamburger los",p:2.80,vega:false},
    {n:"Braadworst",p:2.85,vega:false},{n:"Mexicano",p:2.85,vega:false},
    {n:"Bitterballen (6)",p:2.85,vega:false},{n:"Frikandel mayo",p:2.90,vega:false},
    {n:"Kipfingers (6)",p:2.95,vega:false},{n:"Frikandel speciaal ketchup",p:2.95,vega:false},
    {n:"Frikandel mayo & ketchup",p:2.95,vega:false},{n:"Frikandel mayo & curry",p:2.95,vega:false},
    {n:"Frikandel spec. oliehoorn curry",p:2.95,vega:false},{n:"Frikandel speciaal",p:2.95,vega:false},
    {n:"Mini loempia's (6)",p:2.95,vega:true},
    {n:"Gehaktbal",p:3.00,vega:false},{n:"Berenhap",p:3.10,vega:false},
    {n:"Vlammetjes (6)",p:3.50,vega:false},{n:"Kipstrips (3)",p:3.65,vega:false},
    {n:"Kip nuggets (6)",p:3.80,vega:false},{n:"Loempia",p:3.95,vega:false},
    {n:"Varkensschnitzel",p:3.95,vega:false},{n:"Wings (5)",p:4.20,vega:false},
    {n:"Kaastengels (6)",p:4.25,vega:false},{n:"Kipschnitzel",p:4.50,vega:false},
    {n:"Kip nuggets (9)",p:4.80,vega:false},{n:"Kipstrips (5)",p:4.90,vega:false},
    {n:"Loempia speciaal",p:5.50,vega:false},{n:"Boerenschnitzel",p:5.75,vega:false},
    {n:"Kip saté (3 stokjes)",p:6.95,vega:false},{n:"Halve kip",p:6.95,vega:false},
    {n:"Kip nuggets (20)",p:9.95,vega:false}
  ];

  const SAUS_PRIJS=0.75;
  // GEK = echte sauzen, raar gecombineerd (mag absurd zijn).
  const SAUS_GEK=[
    "oorlog scherp","satésaus scherp + knoflook","zigeunersaus + appelmoes",
    "chilisaus + joppiesaus","mayo + ui + curry","jambala + satésaus scherp",
    "knoflook + appelmoes","ketchup + zigeunersaus","oorlog zoet + extra ui",
    "speciaal + chilisaus"
  ];
  const SHAKE_SMAKEN=["aardbei","banaan","chocola","vanille","kiwi"];

  /* ===== emoji per snack (voor de slot-rollen) ===== */
  const FOOD_POOL=['🍟','🍗','🌭','🧀','🍔','🥟','🍢','🧆','🍜','🥚','🍖','🌶️','🥗','🌯','🥤','🥔'];
  function emojiFor(name){
    const n=name.toLowerCase();
    if(/patat|aardappel/.test(n)) return '🍟';
    if(/shake/.test(n)) return '🥤';
    if(/frikandel/.test(n)) return '🌭';
    if(/worst/.test(n)) return '🌭';
    if(/kaas|tengel|souffl/.test(n)) return '🧀';
    if(/kip|nugget|wing|corn|strip|finger/.test(n)) return '🍗';
    if(/schnitzel|varken|boeren|gehakt|berenhap/.test(n)) return '🍖';
    if(/kroket|krokidel|pikanto|nasi/.test(n)) return '🥔';
    if(/bal|bitterbal/.test(n)) return '🧆';
    if(/loempia|smulrol|shoarma|sito|trio|brok/.test(n)) return '🌯';
    if(/bami/.test(n)) return '🍜';
    if(/ei/.test(n)) return '🥚';
    if(/vlam|mexicano|hete donder/.test(n)) return '🌶️';
    if(/slaatje|rauwkost|groente|vega|salade/.test(n)) return '🥗';
    if(/hamburger|burger/.test(n)) return '🍔';
    return '🍴';
  }

  /* =========================== STATE & UI ================================== */
  let mode="wonder", nSnacks=1, patatSize="klein", patatPrijs=2.35, shakeSize="klein", shakePrijs=3.00;
  let spinning=false, muted=false, bonTekst="", bonVol="";
  let budgetOn=false, budget=10;
  let vegaMode="alles"; // alles = vlees + vega, geen = geen vega, alleen = alleen vega

  // Snack-pool op basis van de vega-keuze.
  function vegaPool(){
    if(vegaMode==='alleen') return SNACKS.filter(s=>s.vega);
    if(vegaMode==='geen')   return SNACKS.filter(s=>!s.vega);
    return SNACKS;
  }

  const bulbs=document.getElementById('bulbs');
  for(let i=0;i<7;i++){const b=document.createElement('div');b.className='bulb';bulbs.appendChild(b);}

  function setMode(el){if(spinning)return;document.querySelectorAll('.mode').forEach(m=>m.classList.remove('on'));el.classList.add('on');mode=el.dataset.mode;}

  function segPick(container, cb){
    document.querySelectorAll('#'+container+' button').forEach(b=>b.onclick=()=>{
      if(spinning)return;
      document.querySelectorAll('#'+container+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); cb(b); updateBudgetWarning();
    });
  }
  segPick('seg-vega', b=>vegaMode=b.dataset.v);
  segPick('seg-snacks', b=>nSnacks=+b.dataset.v);
  segPick('seg-patat', b=>{patatSize=b.dataset.v; patatPrijs=+b.dataset.p;});
  segPick('seg-shake', b=>{shakeSize=b.dataset.v; shakePrijs=+b.dataset.p;});

  function togglePatat(){if(spinning)return;const t=document.getElementById('t-patat');t.classList.toggle('on');document.getElementById('sub-patat').classList.toggle('show',t.classList.contains('on'));updateBudgetWarning();}
  function toggleShake(){if(spinning)return;const t=document.getElementById('t-shake');t.classList.toggle('on');document.getElementById('sub-shake').classList.toggle('show',t.classList.contains('on'));updateBudgetWarning();}
  function toggleBudget(){if(spinning)return;const t=document.getElementById('t-budget');t.classList.toggle('on');budgetOn=t.classList.contains('on');document.getElementById('sub-budget').classList.toggle('show',budgetOn);updateBudgetWarning();}
  function setBudget(v){
    budget=Math.min(99, Math.max(1, Math.round(+v||1)));
    const rng=document.getElementById('rng-budget'), num=document.getElementById('num-budget');
    rng.value=Math.min(Math.max(budget,+rng.min),+rng.max); // slider klemt op 3–30
    if(num.value!==String(budget)) num.value=budget;
    updateBudgetWarning();
  }
  function onSlider(v){ setBudget(v); }
  function onNum(v){ if(v==='') return; budget=Math.min(99,Math.max(1,Math.round(+v||1))); const rng=document.getElementById('rng-budget'); rng.value=Math.min(Math.max(budget,+rng.min),+rng.max); updateBudgetWarning(); }
  function fixNum(){ setBudget(budget); } // leeg/ongeldig veld herstellen bij verlaten

  // Goedkoopst mogelijke totaal voor de huidige keuzes — om vooraf te waarschuwen.
  function minTotaal(){
    const kosten=vegaPool()
      .map(s=>s.p+(geenLosseSaus(s.n)?0:SAUS_PRIJS)).sort((a,b)=>a-b);
    let sum=0; for(let i=0;i<nSnacks && i<kosten.length;i++) sum+=kosten[i];
    if(document.getElementById('t-patat').classList.contains('on')) sum+=patatPrijs+SAUS_PRIJS;
    if(document.getElementById('t-shake').classList.contains('on')) sum+=shakePrijs;
    return sum;
  }
  function updateBudgetWarning(){
    const w=document.getElementById('budgetWarn'); if(!w) return;
    if(!budgetOn){ w.classList.remove('show'); return; }
    const min=minTotaal();
    if(min>budget+0.001){
      w.textContent=`⚠️ Met deze keuzes haal je ${eur(budget)} niet — je hebt minstens ${eur(min)} nodig.`;
      w.classList.add('show');
    } else {
      w.classList.remove('show');
    }
  }

  /* =========================== GELUID (WebAudio) =========================== */
  let audioCtx=null;
  function ac(){ if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}} if(audioCtx.state==='suspended')audioCtx.resume(); return audioCtx; }
  function blip(freq,dur,type,vol){
    if(muted)return; const c=ac(); if(!c)return;
    const o=c.createOscillator(),g=c.createGain(); o.type=type||'square'; o.frequency.value=freq;
    o.connect(g); g.connect(c.destination); const t=c.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02);
  }
  function tick(){ blip(1100+Math.random()*500,0.045,'square',0.05); }
  function ding(){ blip(880,0.12,'triangle',0.18); setTimeout(()=>blip(1320,0.22,'triangle',0.18),70); }
  function jackpot(){ [660,880,1100,1320,1660].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'square',0.12),i*70)); }
  function toggleMute(){ muted=!muted; document.getElementById('mute').textContent=muted?'🔇':'🔊'; if(!muted)ac(); }

  /* =========================== GENERATIE =================================== */
  const pick=(a,n)=>{const c=[...a];const o=[];while(o.length<n&&c.length)o.push(c.splice(Math.random()*c.length|0,1)[0]);return o;};
  const one=a=>a[Math.random()*a.length|0];
  const eur=v=>'€'+v.toFixed(2).replace('.',',');

  function randSmaak(){
    if(mode==='gek' && Math.random()<0.6){ const [a,b]=pick(SHAKE_SMAKEN,2); return `${a}–${b} swirl`; }
    return one(SHAKE_SMAKEN);
  }

  /* ===== Saus-logica =====
     Geen dubbele saus (snacks die 'm al in de naam hebben), geen losse saus op
     saté/salades. Wonder = gecureerd lekker, met ~30% kans op een verrassende
     'WAUW'-combo. Gek = echte sauzen, absurd gecombineerd. */
  function geenLosseSaus(naam){
    const n=naam.toLowerCase();
    if(/slaatje|rauwkost/.test(n)) return true;                 // salades
    if(/kip saté|kip sate/.test(n)) return true;                // komt al met satésaus
    if(/mayo|ketchup|speciaal|oorlog|joppie|oliehoorn|puinhoop|& curry|curry &/.test(n)) return true; // al gesausd
    return false;
  }
  const WONDER_SAUS=[
    {m:/patat|aardappel/,                    goed:['mayonaise','currysaus','joppiesaus','speciaalsaus'], wauw:['oorlog zoet','satésaus zoet']},
    {m:/bami|nasi/,                          goed:['satésaus zoet','currysaus'],            wauw:['chilisaus']},
    {m:/loempia|loempidel|smulrol|shoarmarol|sitostick/, goed:['chilisaus','satésaus zoet'], wauw:['zigeunersaus']},
    {m:/kip|nugget|wing|corn|strip|finger/,  goed:['currysaus','satésaus zoet','chilisaus'], wauw:['jambala']},
    {m:/kaas|tengel|souffl/,                 goed:['chilisaus','ketchup'],                  wauw:['satésaus zoet']},
    {m:/vlam|mexicano|pikanto|hete donder/,  goed:['chilisaus','zigeunersaus'],             wauw:['knoflooksaus']},
    {m:/kroket|krokidel/,                    goed:['mayonaise','currysaus'],                wauw:['joppiesaus']},
    {m:/bitterbal|gehaktbal|eierbal/,        goed:['mayonaise','currysaus'],                wauw:['chilisaus']},
    {m:/frikandel/,                          goed:['currysaus','joppiesaus','mayonaise'],   wauw:['satésaus zoet']},
    {m:/schnitzel|varken|boeren|braadworst|hamburger|berenhap|brok|trio|vlampijp/, goed:['zigeunersaus','speciaalsaus','mayonaise'], wauw:['jambala']}
  ];
  const WONDER_DEFAULT={goed:['mayonaise','currysaus','joppiesaus'], wauw:['satésaus zoet']};
  function wonderSaus(naam){
    const set=WONDER_SAUS.find(e=>e.m.test(naam.toLowerCase()))||WONDER_DEFAULT;
    const wauw = Math.random()<0.3 && set.wauw && set.wauw.length;
    return one(wauw ? set.wauw : set.goed);
  }
  function kiesSaus(naam){
    if(geenLosseSaus(naam)) return null;
    return mode==='wonder' ? wonderSaus(naam) : one(SAUS_GEK);
  }

  function verhaal(chosen, saus, shake){
    const a=chosen[0].n;
    const multi=chosen.length>1;
    const combo = multi ? `${a} en ${chosen[1].n}` : a;
    const shakeBit = shake ? ` De ${shake} milkshake spoelt het weg als een beloning.` : '';
    const metSaus = saus ? ` met ${saus}` : '';
    const sausAf = saus ? ` Een lik ${saus}, en de avond is geslaagd.` : '';
    const sausErover = saus ? ` Met ${saus} erover wordt het pas echt af.` : '';
    const sausGoten = saus ? ` overgoten met ${saus}` : '';
    const onderwerp = multi ? combo : `de ${a}`;
    const wonder = multi ? [
      `Het orakel legde ${combo} naast elkaar en knikte traag: knapperig, hartig, in balans.${sausErover}${shakeBit}`,
      `${combo}${metSaus} — een combinatie die klinkt als een klassieker-in-wording. Dit bestel je met droge ogen.`,
      `Vertrouw het orakel: ${combo} horen samen zoals vrijdag en frituur.${sausAf}${shakeBit}`
    ] : [
      `Het orakel bekeek ${onderwerp} van alle kanten en knikte traag: knapperig, hartig, precies goed.${sausErover}${shakeBit}`,
      `${a}${metSaus} is geen gok maar een klassieker. Dit bestel je met droge ogen — Karst-keurmerk.`,
      `Vertrouw het orakel: ${a}${metSaus} hoort bij een goede vrijdagavond.${shakeBit}`
    ];
    const gek = [
      `Niemand vroeg om ${combo}${metSaus}. En tóch fluistert het orakel: probeer het één keer, en je vertelt het na aan je kleinkinderen.`,
      `${combo}${sausGoten} — wetenschappelijk twijfelachtig, frituurtechnisch legendarisch. Durf jij?${shake?` Wegspoelen met een ${shake} shake.`:''}`,
      `Het orakel was stellig (en mogelijk licht beneveld): ${combo}${metSaus} hoort eigenlijk nergens, dus juist daarom moet het. Eén hap en je leeft op het randje.`
    ];
    return one(mode==='wonder'?wonder:gek);
  }

  // Bouwt de uitkomst: snacks + sauzen + patat + shake + verhaal.
  function maakOrder(){
    const pool = vegaPool();
    const chosen = pick(pool,nSnacks);

    let tot=0; const lines=[]; const reelItems=[]; const snackNamen=[];
    chosen.forEach(s=>{
      const saus=kiesSaus(s.n); tot+=s.p+(saus?SAUS_PRIJS:0);
      lines.push({type:'snack', naam:s.n, prijs:s.p, vega:s.vega, saus});
      reelItems.push({emoji:emojiFor(s.n), label:s.n});
      snackNamen.push(s.n);
    });
    let patat=null, shake=null;
    if(document.getElementById('t-patat').classList.contains('on')){
      const saus=kiesSaus(`Patat ${patatSize}`); tot+=patatPrijs+(saus?SAUS_PRIJS:0);
      patat={naam:`Patat ${patatSize}`, prijs:patatPrijs, saus};
      reelItems.push({emoji:'🍟', label:`Patat ${patatSize}`});
    }
    if(document.getElementById('t-shake').classList.contains('on')){
      const smaak=randSmaak(); tot+=shakePrijs;
      shake={naam:`Milkshake ${shakeSize}`, smaak, prijs:shakePrijs};
      reelItems.push({emoji:'🥤', label:smaak});
    }
    const repSaus = (lines.find(l=>l.saus)||{}).saus || (patat&&patat.saus) || null;
    const story = verhaal(chosen, repSaus, shake?shake.smaak:null);
    return {chosen, lines, patat, shake, tot, story, reelItems, snackNamen};
  }

  /* =========================== SLOT-ROLLEN ================================= */
  const TILE_H=72, N_TILES=22;
  function buildReels(items){
    const slot=document.getElementById('slot'); slot.innerHTML=''; slot.classList.add('show');
    return items.map(it=>{
      const reel=document.createElement('div'); reel.className='reel';
      const win=document.createElement('div'); win.className='window';
      const strip=document.createElement('div'); strip.className='strip';
      for(let i=0;i<N_TILES;i++){ const t=document.createElement('div'); t.className='tile'; t.textContent=FOOD_POOL[Math.random()*FOOD_POOL.length|0]; strip.appendChild(t); }
      const target=document.createElement('div'); target.className='tile'; target.textContent=it.emoji; strip.appendChild(target);
      win.appendChild(strip); reel.appendChild(win);
      const lab=document.createElement('div'); lab.className='reel-label'; lab.textContent=it.label;
      reel.appendChild(lab);
      slot.appendChild(reel);
      return {reel, strip, label:lab};
    });
  }
  function spinReels(reels){
    return new Promise(resolve=>{
      const ticker=setInterval(tick,75);
      let locked=0;
      reels.forEach((r,i)=>{
        const dur=1100+i*520;
        r.strip.style.transition='none';
        r.strip.style.transform='translateY(0)';
        r.strip.style.filter='blur(1.4px)';   // snacks flitsen langs
        // forceer reflow zodat de transition vanaf 0 start
        void r.strip.offsetHeight;
        requestAnimationFrame(()=>{
          r.strip.style.transition=`transform ${dur}ms cubic-bezier(.12,.62,.2,1)`;
          r.strip.style.transform=`translateY(-${N_TILES*TILE_H}px)`;
        });
        // blur eraf vlak vóór stilstand → scherpe landing
        setTimeout(()=>{ r.strip.style.filter='none'; }, dur-260);
        setTimeout(()=>{
          r.reel.classList.add('locked');
          r.label.style.opacity='1'; // commit zichtbaar (CSS .stamp doet de pop in een echte browser)
          ding(); locked++;
          if(locked===reels.length){ clearInterval(ticker); jackpot(); resolve(); }
        }, dur+30);
      });
    });
  }

  /* =========================== RENDER BON ================================== */
  function renderBon(order){
    const box=document.getElementById('items'); box.innerHTML='';
    const regels=[];
    const addItem=(q,naam,prijs,vega)=>{
      const d=document.createElement('div'); d.className='item';
      d.innerHTML=`<span><span class="q">${q}×</span> ${naam}${vega?'<span class="tag">veg</span>':''}</span><span>${eur(prijs)}</span>`;
      box.appendChild(d); regels.push(`${q}x ${naam}  ${eur(prijs)}`);
    };
    const addSaus=(saus)=>{
      const sd=document.createElement('div'); sd.className='saus';
      sd.innerHTML=`↳ met <b>${saus}</b> <span style="float:right">${eur(SAUS_PRIJS)}</span>`;
      box.appendChild(sd); regels.push(`   ↳ met ${saus}  ${eur(SAUS_PRIJS)}`);
    };
    order.lines.forEach(l=>{ addItem(1,l.naam,l.prijs,l.vega); if(l.saus) addSaus(l.saus); });
    if(order.patat){ addItem(1,order.patat.naam,order.patat.prijs,false); if(order.patat.saus) addSaus(order.patat.saus); }
    if(order.shake){ addItem(1,`${order.shake.naam} ${order.shake.smaak}`,order.shake.prijs,false); }

    const st=document.createElement('div'); st.className='story'; st.textContent='“'+order.story+'”'; box.appendChild(st);
    document.getElementById('totaal').textContent=eur(order.tot);

    const bon=document.getElementById('bon'); bon.classList.remove('show'); void bon.offsetWidth; bon.classList.add('show');

    // Twee kopie-varianten:
    //  - bonTekst = alle items met saus, platte tekst (handig om te bestellen)
    //  - bonVol   = de volledige bon met prijzen, totaal en verhaaltje
    const kopie=[];
    order.lines.forEach(l=> kopie.push(l.saus ? `${l.naam} met ${l.saus}` : l.naam));
    if(order.patat) kopie.push(order.patat.saus ? `${order.patat.naam} met ${order.patat.saus}` : order.patat.naam);
    if(order.shake) kopie.push(`${order.shake.naam} ${order.shake.smaak}`);
    bonTekst=kopie.join('\n');
    bonVol=`🍟 HET SNACKORAKEL — Snackbar Karst, Dedemsvaart\n(${mode==='wonder'?'Wonder ✨':'Gek 🤪'})\n`+
      `--------------------------------\n`+regels.join('\n')+`\n`+
      `--------------------------------\nTotaal  ${eur(order.tot)}\n\n“${order.story}”`;
  }

  /* Budget als plafond: behoud de keuzes, maar her-genereer tot 't binnen budget past.
     Lukt het niet, dan de goedkoopste poging + een grappige 'te krap'-regel. */
  const KRAP=[
    (b)=>`Voor ${eur(b)} rekt zelfs het orakel zich uit de naad — dit is het dichtst bij. Gooi er een paar euro bij. 😅`,
    (b)=>`Het orakel schudt het hoofd: voor ${eur(b)} krijg je hooguit dit. Honger bouwt karakter.`,
    (b)=>`${eur(b)}? Ambitieus. Het orakel deed z'n best, maar de frituur kent geen wonderen voor dat bedrag.`
  ];
  function kiesOrder(){
    if(!budgetOn) return maakOrder();
    let best=maakOrder();
    if(best.tot<=budget) return best;
    for(let i=0;i<200 && best.tot>budget;i++){
      const c=maakOrder();
      if(c.tot<best.tot) best=c;
      if(best.tot<=budget) break;
    }
    if(best.tot>budget){ best.overBudget=true; best.story=one(KRAP)(budget); }
    return best;
  }

  /* =========================== HOOFD-FLOW ================================== */
  async function rammen(){
    if(spinning)return;
    spinning=true;
    const btn=document.getElementById('btn-rammen'); btn.disabled=true; btn.textContent='DRAAIT…';
    document.getElementById('ph').style.display='none';
    document.getElementById('bon').classList.remove('show');
    ac(); // audio activeren op user-gesture

    const order=kiesOrder();
    const reels=buildReels(order.reelItems);
    document.getElementById('slot').scrollIntoView({block:'center',behavior:'smooth'});
    await spinReels(reels);
    renderBon(order);
    setTimeout(()=>document.getElementById('bon').scrollIntoView({block:'center',behavior:'smooth'}),120);

    btn.disabled=false; btn.textContent='RAMMEN!'; spinning=false;
  }

  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
  // Kopieert naar het klembord als platte tekst (geen deel-menu).
  // kind='vol' = volledige bon, kind='tekst' = alleen de items.
  async function deelBon(kind){
    const txt = kind==='vol' ? bonVol : bonTekst;
    if(!txt){toast('Eerst rammen!');return;}
    const melding = kind==='vol' ? 'Bon gekopieerd 📋' : 'Gekopieerd als tekst 📋';
    try{
      await navigator.clipboard.writeText(txt); toast(melding);
    }catch(e){
      try{
        const ta=document.createElement('textarea'); ta.value=txt;
        ta.style.position='fixed'; ta.style.top='-1000px'; ta.setAttribute('readonly','');
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        toast(melding);
      }catch(_){ toast('Kopiëren mislukt'); }
    }
  }
</script>
<script>
  /* PWA: registreer de service worker zodat de app installeerbaar is en offline werkt. */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }

  /* Installeerknop: vang de install-prompt op en toon 'm in de app zelf. */
  let deferredPrompt=null;
  const installBtn=document.getElementById('installBtn');
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferredPrompt=e;
    if(!isStandalone) installBtn.classList.add('show');
  });
  window.addEventListener('appinstalled', ()=>{ deferredPrompt=null; installBtn.classList.remove('show'); });

  // iOS vuurt geen prompt af → toon de knop met een uitleg-hint.
  if(isIOS && !isStandalone) installBtn.classList.add('show');

  async function doInstall(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      const {outcome}=await deferredPrompt.userChoice;
      deferredPrompt=null;
      if(outcome==='accepted') installBtn.classList.remove('show');
      return;
    }
    if(isIOS){ toast('Tik op  ⬆️  (Deel) → "Zet op beginscherm"'); return; }
    toast('Open het browsermenu (⋮) → "App installeren"');
  }
</script>
